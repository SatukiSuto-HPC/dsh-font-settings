name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      # Standard recipe: setup-node writes //registry.npmjs.org/:_authToken
      # into the temp npmrc it points NPM_CONFIG_USERCONFIG at, but ONLY when
      # NODE_AUTH_TOKEN is visible to the setup-node step itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Masked sanity check of the generated npmrc (never prints the token).
      - name: Verify registry auth (masked)
        run: sed 's/_authToken=.*/_authToken=<set>/' "$NPM_CONFIG_USERCONFIG"
      - run: npm publish --access public
