name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      # setup-node points NPM_CONFIG_USERCONFIG at its own temp npmrc, so the
      # token must be written THERE (npm >= 11 ignores bare NODE_AUTH_TOKEN,
      # and ~/.npmrc is bypassed while NPM_CONFIG_USERCONFIG is set).
      - name: Configure registry auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> "$NPM_CONFIG_USERCONFIG"
      - run: npm publish --access public
